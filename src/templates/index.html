<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸库和视频处理</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --accent-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
            --text-color: #333;
            --border-radius: 12px;
            --box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        h1 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 40px;
            font-size: 2.5em;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .upload-section {
            margin-bottom: 40px;
            padding: 25px;
            border-radius: var(--border-radius);
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .upload-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
        }

        .upload-section.photo-section {
            border: 2px solid var(--primary-color);
        }

        .upload-section.video-section {
            border: 2px solid var(--secondary-color);
        }

        .upload-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .photo-section h2 {
            color: var(--primary-color);
        }

        .video-section h2 {
            color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 1.1em;
        }

        .file-input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: var(--border-radius);
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            transition: var(--transition);
        }

        .file-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .text-input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: var(--border-radius);
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            transition: var(--transition);
        }

        .text-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }

        .options-section {
            margin: 25px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            background-color: #f9f9f9;
        }

        .options-section h3 {
            color: var(--dark-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .options label {
            display: flex;
            align-items: center;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .options label:hover {
            background-color: rgba(52, 152, 219, 0.1);
        }

        .options input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn {
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: var(--transition);
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-blue {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .btn-green {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--border-radius);
            display: none;
            font-weight: 500;
            animation: fadeIn 0.3s ease-in;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .file-name {
            margin: 15px 0;
            padding: 12px;
            background-color: #e8f4f8;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 500;
            color: #2c3e50;
        }

        .download-section {
            margin-top: 25px;
            padding: 20px;
            border: 2px solid var(--secondary-color);
            border-radius: var(--border-radius);
            background-color: #f0fff4;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .download-section h3 {
            color: var(--secondary-color);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .hint {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .upload-section {
                padding: 20px;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>人脸库和视频处理系统</h1>
        
        <!-- 照片上传区域 -->
        <div class="upload-section photo-section">
            <h2>上传照片到人脸库</h2>
            <div class="form-group">
                <label for="photoUpload">选择照片：</label>
                <input type="file" id="photoUpload" class="file-input" accept="image/*" onchange="handlePhotoSelect()">
                <div id="photoFileName" class="file-name"></div>
            </div>
            <div class="form-group">
                <label for="photoName">自定义名称（可选）：</label>
                <input type="text" id="photoName" class="text-input" placeholder="例如：张三、person1 等">
                <div class="hint">留空则使用原文件名</div>
            </div>
            <button class="btn btn-blue" id="uploadPhotoBtn" onclick="uploadPhoto()" disabled>上传照片</button>
            <div id="photoStatus" class="status"></div>
            <div id="photoLoading" class="loading">
                <div class="loading-spinner"></div>
                <p>正在上传照片...</p>
            </div>
        </div>
        
        <!-- 视频上传区域 -->
        <div class="upload-section video-section">
            <h2>上传视频进行处理</h2>
            <div class="form-group">
                <label for="videoUpload">选择视频：</label>
                <input type="file" id="videoUpload" class="file-input" accept="video/*" onchange="handleVideoSelect()">
                <div id="videoFileName" class="file-name"></div>
            </div>
            
            <div class="options-section">
                <h3>处理选项</h3>
                <div class="options">
                    <label>
                        <input type="checkbox" id="applyMosaic">
                        应用马赛克
                    </label>
                    <label>
                        <input type="checkbox" id="faceDetection">
                        启用人脸识别
                    </label>
                </div>
                
                <div class="form-group" id="mosaicTypeGroup" style="display: none; margin-top: 15px;">
                    <label for="mosaicType">马赛克类型：</label>
                    <select id="mosaicType" class="text-input">
                        <option value="pixelate">像素化马赛克</option>
                        <option value="gaussian">高斯模糊马赛克</option>
                        <option value="mean">均值模糊马赛克</option>
                        <option value="median">中值模糊马赛克</option>
                        <option value="color">颜色填充马赛克</option>
                    </select>
                    <div class="hint">选择不同的马赛克处理方式</div>
                </div>
            </div>
            
            <button class="btn btn-green" id="uploadVideoBtn" onclick="uploadVideo()" disabled>上传并处理视频</button>
            <div id="videoStatus" class="status"></div>
            <div id="videoLoading" class="loading">
                <div class="loading-spinner"></div>
                <p>正在处理视频，请稍候...</p>
            </div>
            
            <div id="downloadSection" class="download-section">
                <h3>✓ 处理完成</h3>
                <a id="downloadLink" class="btn btn-green" download>下载处理后的视频</a>
            </div>
        </div>
    </div>

    <script>
        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        function handlePhotoSelect() {
            const fileInput = document.getElementById('photoUpload');
            const file = fileInput.files[0];
            const fileNameDiv = document.getElementById('photoFileName');
            const uploadBtn = document.getElementById('uploadPhotoBtn');
            
            if (file) {
                fileNameDiv.textContent = '已选择: ' + file.name;
                uploadBtn.disabled = false;
            } else {
                fileNameDiv.textContent = '';
                uploadBtn.disabled = true;
            }
        }

        function handleVideoSelect() {
            const fileInput = document.getElementById('videoUpload');
            const file = fileInput.files[0];
            const fileNameDiv = document.getElementById('videoFileName');
            const uploadBtn = document.getElementById('uploadVideoBtn');
            
            if (file) {
                fileNameDiv.textContent = '已选择: ' + file.name;
                uploadBtn.disabled = false;
            } else {
                fileNameDiv.textContent = '';
                uploadBtn.disabled = true;
            }
        }

        // 监听马赛克复选框的变化
        document.getElementById('applyMosaic').addEventListener('change', function() {
            const mosaicTypeGroup = document.getElementById('mosaicTypeGroup');
            if (this.checked) {
                mosaicTypeGroup.style.display = 'block';
            } else {
                mosaicTypeGroup.style.display = 'none';
            }
        });

        async function uploadPhoto() {
            const fileInput = document.getElementById('photoUpload');
            const file = fileInput.files[0];
            const nameInput = document.getElementById('photoName');
            
            if (!file) {
                showStatus('photoStatus', '请选择一个照片文件。', 'error');
                return;
            }
            
            // 显示加载指示器
            document.getElementById('photoLoading').style.display = 'block';
            document.getElementById('photoStatus').style.display = 'none';
            
            // 创建FormData对象
            const formData = new FormData();
            formData.append('file', file);
            if (nameInput.value.trim()) {
                formData.append('name', nameInput.value.trim());
            }
            
            try {
                // 发送请求到服务器
                const response = await fetch('/upload_photo', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                // 隐藏加载指示器
                document.getElementById('photoLoading').style.display = 'none';
                
                if (result.success) {
                    showStatus('photoStatus', result.message, 'success');
                    // 清空输入
                    nameInput.value = '';
                    fileInput.value = '';
                    document.getElementById('photoFileName').textContent = '';
                    document.getElementById('uploadPhotoBtn').disabled = true;
                } else {
                    showStatus('photoStatus', result.error, 'error');
                }
            } catch (error) {
                // 隐藏加载指示器
                document.getElementById('photoLoading').style.display = 'none';
                showStatus('photoStatus', '上传失败: ' + error.message, 'error');
            }
        }

        async function uploadVideo() {
            const fileInput = document.getElementById('videoUpload');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('videoStatus', '请选择一个视频文件。', 'error');
                return;
            }
            
            const applyMosaic = document.getElementById('applyMosaic').checked;
            const enableFaceDetection = document.getElementById('faceDetection').checked;
            let mosaicType = 'pixelate'; // 默认值
            
            // 如果启用了马赛克，获取选择的马赛克类型
            if (applyMosaic) {
                mosaicType = document.getElementById('mosaicType').value;
            }
            
            // 显示加载指示器
            document.getElementById('videoLoading').style.display = 'block';
            document.getElementById('videoStatus').style.display = 'none';
            document.getElementById('downloadSection').style.display = 'none';
            
            // 创建FormData对象
            const formData = new FormData();
            formData.append('file', file);
            formData.append('applyMosaic', applyMosaic);
            formData.append('faceDetection', enableFaceDetection);
            formData.append('mosaicType', mosaicType);
            
            try {
                // 发送请求到服务器
                const response = await fetch('/upload_video', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                // 隐藏加载指示器
                document.getElementById('videoLoading').style.display = 'none';
                
                if (result.success) {
                    showStatus('videoStatus', result.message, 'success');
                    
                    // 显示下载区域
                    const downloadSection = document.getElementById('downloadSection');
                    const downloadLink = document.getElementById('downloadLink');
                    
                    downloadLink.href = result.download_url;
                    downloadSection.style.display = 'block';
                } else {
                    showStatus('videoStatus', result.error, 'error');
                }
            } catch (error) {
                // 隐藏加载指示器
                document.getElementById('videoLoading').style.display = 'none';
                showStatus('videoStatus', '上传失败: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
